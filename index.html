<!DOCTYPE html>
<html>
<head>
    <title>Big Event Registration Form</title>
</head>
<body>

<h1>Big Event Registration</h1>
<p>Please fill out the form below to register.</p>

<form action="#" method="post">

    <h2>Personal Information</h2>

    <label>First Name:</label><br>
    <input type="text" name="first_name" required><br><br>

    <label>Last Name:</label><br>
    <input type="text" name="last_name" required><br><br>

    <label>Email Address:</label><br>
    <input type="email" name="email" required><br><br>

    <label>Phone Number:</label><br>
    <input type="tel" name="phone"><br><br>

    <label>Organization / Company:</label><br>
    <input type="text" name="company"><br><br>

    <h2>Event Details</h2>

    <label>Ticket Type:</label><br>
    <select name="ticket_type" required>
        <option value="">Select Ticket</option>
        <option value="general">General Admission</option>
        <option value="vip">VIP Pass</option>
        <option value="student">Student Pass</option>
    </select><br><br>

    <label>Sessions Interested In:</label><br>
    <input type="checkbox" name="sessions" value="keynote"> Keynote Sessions<br>
    <input type="checkbox" name="sessions" value="workshops"> Workshops<br>
    <input type="checkbox" name="sessions" value="networking"> Networking Events<br>
    <input type="checkbox" name="sessions" value="expo"> Expo / Exhibition<br><br>

    <label>Dietary Requirements:</label><br>
    <input type="text" name="dietary"><br><br>

    <h2>Additional Information</h2>

    <label>How did you hear about this event?</label><br>
    <select name="source">
        <option value="">Select</option>
        <option value="social">Social Media</option>
        <option value="email">Email</option>
        <option value="friend">Friend</option>
        <option value="website">Website</option>
    </select><br><br>

    <label>Comments or Special Requests:</label><br>
    <textarea name="comments" rows="4" cols="40"></textarea><br><br>

    <h2>Consent</h2>

    <input type="checkbox" required> I agree to the terms and conditions<br><br>

    <input type="submit" value="Register">

</form>

</body>
</html>
